<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HireForJob - Find Jobs & Talent Near You</title>
    <meta name="description" content="HireForJob connects job seekers with employers on an interactive map. Find jobs near you, discover local talent, and hire smarter." />
    <meta name="keywords" content="jobs, hiring, recruitment, job search, careers, employment, talent, map-based job search" />
    <meta name="author" content="HireForJob" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="canonical" href="https://hireforjob1.lovable.app" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="HireForJob - Find Jobs & Talent Near You" />
    <meta property="og:description" content="Discover jobs and talent on an interactive map. Connect with employers and candidates in your area." />
    <meta property="og:site_name" content="HireForJob" />
    <meta property="og:url" content="https://hireforjob1.lovable.app" />
    <meta property="og:image" content="https://hireforjob1.lovable.app/logo.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@hireforjob" />
    <meta name="twitter:title" content="HireForJob - Find Jobs & Talent Near You" />
    <meta name="twitter:description" content="Discover jobs and talent on an interactive map." />
    <meta name="twitter:image" content="https://hireforjob1.lovable.app/logo.png" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "HireForJob",
      "url": "https://hireforjob1.lovable.app",
      "description": "Map-based job search platform connecting job seekers with employers",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://hireforjob1.lovable.app/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
