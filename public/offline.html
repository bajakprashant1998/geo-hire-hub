<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Offline – HireForJob</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f8fafc;color:#1e293b}
    .container{text-align:center;padding:2rem;max-width:400px}
    .icon{width:80px;height:80px;margin:0 auto 1.5rem;background:#e2e8f0;border-radius:1rem;display:flex;align-items:center;justify-content:center}
    .icon svg{width:40px;height:40px;color:#64748b}
    h1{font-size:1.5rem;font-weight:700;margin-bottom:.5rem}
    p{color:#64748b;font-size:.95rem;line-height:1.5;margin-bottom:1.5rem}
    button{background:#3b82f6;color:#fff;border:none;padding:.75rem 2rem;border-radius:.75rem;font-size:1rem;font-weight:600;cursor:pointer}
    button:hover{background:#2563eb}
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728M5.636 18.364a9 9 0 010-12.728M8.464 15.536a5 5 0 010-7.072M15.536 8.464a5 5 0 010 7.072M12 12h.01"/>
      </svg>
    </div>
    <h1>You're Offline</h1>
    <p>It looks like you've lost your internet connection. Please check your network and try again.</p>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
